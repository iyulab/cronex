name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore Cronex.slnx

    - name: Build
      run: dotnet build Cronex.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Cronex.slnx --no-build --configuration Release --verbosity normal

    # Timezone/DST handling (spec §3.5) is this library's highest-risk area to run on one platform
    # only — that's what the matrix above is for. The two checks below are build-validation, not
    # platform-sensitive, so they run once (ubuntu) rather than doubling CI minutes for no signal.
    - name: Format check
      if: matrix.os == 'ubuntu-latest'
      run: dotnet format Cronex.slnx --verify-no-changes

    - name: Pack (verify only)
      if: matrix.os == 'ubuntu-latest'
      run: dotnet pack Cronex.slnx --no-build --configuration Release --output ${{ runner.temp }}/pack-verify
