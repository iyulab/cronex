name: Publish to NuGet

on:
  push:
    branches: [ main ]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:   # manual trigger (e.g. first publish without a version bump)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Nothing by default; every job below asks for what it needs.
permissions: {}

# The push to nuget.org is not made here. This workflow builds, tests and packs, uploads the packages as an artifact and asks the
# organization's central publisher (iyulab/nuget-publish) to push them; that repository holds the only trusted-publishing policy
# and checks this repository, this workflow file and the package ids against an allowlist. No NuGet credential or policy lives here.
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.check_tag.outputs.exists == 'false' }}

    steps:
    - uses: actions/checkout@v5

    - name: Extract version from Directory.Build.props
      id: version
      run: |
        VERSION=$(grep -oP '<Version>\K[^<]+' Directory.Build.props)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Detected version: $VERSION"

    # The tag is made only for a version that reached nuget.org (the release job below), so «tag exists» means «published».
    - name: Check if tag already exists
      id: check_tag
      run: |
        if git ls-remote --tags origin "v${{ steps.version.outputs.version }}" | grep -q .; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "Tag v${{ steps.version.outputs.version }} already exists — skipping publish"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Setup .NET 10
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      if: steps.check_tag.outputs.exists == 'false'
      run: dotnet restore Cronex.slnx

    - name: Build
      if: steps.check_tag.outputs.exists == 'false'
      run: dotnet build Cronex.slnx --no-restore --configuration Release

    - name: Test
      if: steps.check_tag.outputs.exists == 'false'
      # xUnit v3 / Microsoft.Testing.Platform:
      # --hangdump/--hangdump-timeout is MTP's equivalent of VSTest's --blame-hang.
      run: dotnet test --solution Cronex.slnx --no-build --configuration Release --verbosity normal --hangdump --hangdump-timeout 5m

    # Pack every packable project in the solution, not just the two named today. Naming individual
    # csproj files here is the same defect class that left FluxImprover.LMSupply and
    # FileFlux.Providers.LMSupply unpublished at every version until it was noticed (see
    # iyulab/FluxImprover@4f01b46, iyulab/FileFlux nuget-publish.yml) — a package that is never
    # produced cannot fail to push, so the gap stays invisible until someone looks for it on
    # NuGet.org. Packing the solution plus a verification step closes it for any future addition.
    - name: Pack
      if: steps.check_tag.outputs.exists == 'false'
      run: dotnet pack Cronex.slnx --no-build --configuration Release --output ./nupkg

    - name: Verify all packable projects were produced
      if: steps.check_tag.outputs.exists == 'false'
      run: |
        version="${{ steps.version.outputs.version }}"
        missing=0
        # PackageId does not match the csproj filename here (Cronex.csproj -> Cronex.Net), so read
        # it from the csproj instead of assuming filename match — a wrong assumption here reports a
        # package as missing when it was in fact produced, and a gate that cries wolf gets ignored.
        for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' Cronex.slnx); do
          id=$(grep -oP '(?<=<PackageId>)[^<]+' "$csproj")
          if [ ! -f "./nupkg/${id}.${version}.nupkg" ]; then
            echo "::error::${id}.${version}.nupkg was not produced"
            missing=1
          fi
        done
        [ "$missing" -eq 0 ]

    # Only .nupkg and .snupkg files: the central publisher refuses an artifact that holds anything else.
    - name: Upload packages
      if: steps.check_tag.outputs.exists == 'false'
      uses: actions/upload-artifact@v7
      with:
        name: nuget-packages
        path: |
          ./nupkg/*.nupkg
          ./nupkg/*.snupkg
        if-no-files-found: error
        retention-days: 1

  # Asks the central publisher to push the packages and waits for its answer: this job succeeds only when they are on nuget.org.
  # Until the repository is on the publisher's allowlist the call is refused and the jobs after it do not run.
  publish:
    needs: pack
    if: ${{ needs.pack.outputs.publish == 'true' }}
    uses: iyulab/nuget-publish/.github/workflows/request.yml@2166748abf716fb58855228f65fc6b8f78c2780f # main
    permissions: {}
    secrets: inherit

  # The tag and the GitHub release exist only for a version that reached nuget.org.
  release:
    needs: [pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # tag + GitHub release
    steps:
    - uses: actions/checkout@v5

    # Release notes = this version's CHANGELOG.md section. Every iyulab publish workflow carries this awk program
    # verbatim; change it in all of them or in none.
    - name: GitHub release (notes = this version's CHANGELOG section)
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(grep -oP '<(Version|VersionPrefix)>\K[^<]+' Directory.Build.props | head -1)
        if gh release view "v$VERSION" >/dev/null 2>&1; then echo "Release v$VERSION already exists"; exit 0; fi
        awk -v v="$VERSION" '/^## /{if(p)exit;h=$0;sub(/^## +\[?v?/,"",h);c=substr(h,length(v)+1,1);if(index(h,v)==1&&(c==""||c=="]"||c==" "||c=="\t")){p=1;next}}p&&(n||$0!~/^[ \t]*$/){l[++n]=$0}END{while(n&&(l[n]~/^[ \t]*$/||l[n]~/^---+$/))n--;for(i=1;i<=n;i++)print l[i]}' CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then echo "::error::CHANGELOG.md has no section for $VERSION"; exit 1; fi
        gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md --target "$GITHUB_SHA"
